name: Update GitHub Stats SVGs

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:         # allows manual run from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Stats card (no external service — runs entirely inside this Action)
        # The "stats" card needs read:user scope to query account-level data (total
        # contributions, etc.) via GraphQL. The auto-provided GITHUB_TOKEN can't do this
        # (it's repo-scoped only), so this step uses a Personal Access Token stored as
        # the STATS_TOKEN secret instead. See README/chat notes for how to create it.
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=Aseel27Yassin&show_icons=true&hide_border=true&theme=dark
          path: assets/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate Top Languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=Aseel27Yassin&layout=compact&hide_border=true&theme=dark
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # streak-stats.demolab.com is a *different* service from github-readme-stats
      # and is currently reliable, so it's fetched normally rather than replaced.
      - name: Fetch Streak Stats card
        run: |
          mkdir -p assets
          curl -sL "https://streak-stats.demolab.com/?user=Aseel27Yassin&theme=dark&hide_border=true" -o assets/streak.svg
          # Safety check: make sure we actually got an SVG, not an error page
          if ! head -c 200 assets/streak.svg | grep -q "<svg"; then
            echo "Streak card fetch failed or returned a non-SVG response — keeping previous version."
            git checkout -- assets/streak.svg || true
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/top-langs.svg assets/streak.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: refresh stats SVGs" && git push)
